<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude CLI usage</title>
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; padding: 16px;
    font: 13px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    color: CanvasText; background: Canvas;
  }
  h1 { font-size: 14px; margin: 0 0 12px; font-weight: 600; }
  .row { display: flex; align-items: baseline; gap: 8px; padding: 4px 0; }
  .label { color: GrayText; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .value { font-variant-numeric: tabular-nums; white-space: pre; }
  .bar { height: 4px; border-radius: 2px; background: color-mix(in srgb, CanvasText 12%, transparent); margin: 2px 0 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: AccentColor; }
  .err { color: #c2410c; }
  .muted { color: GrayText; font-size: 12px; }
  code { font-size: 11px; }
</style>
</head>
<body>
<h1>Claude CLI usage</h1>
<div id="view" class="muted">loading…</div>
<script src="main.js"></script>
</body>
</html>
