<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Claude usage</title>
    <link rel="stylesheet" href="main.css">
  </head>
  <body>
    <main id="root">
      <div class="refresh-tools">
        <span id="updated" class="updated" aria-live="polite"></span>
        <button id="refresh" type="button" aria-label="Refresh usage" title="Refresh usage">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" aria-hidden="true"><path d="M13.1 6A5.3 5.3 0 1 0 13 10M13.1 2.8V6H9.9" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div id="usage" class="usage-grid" role="table" aria-label="Claude usage" hidden></div>
      <p id="message" role="status">Reading usage…</p>
    </main>
    <script src="main.js"></script>
  </body>
</html>
